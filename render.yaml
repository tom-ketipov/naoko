# Render Blueprint — https://render.com/docs/blueprint-spec
# New > Blueprint in the Render dashboard, point it at this repo, and it will
# create the "naoko" web service plus a Postgres database wired together.
services:
  - type: web
    name: naoko
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: naoko-db
          property: connectionString

databases:
  - name: naoko-db
    plan: free
    databaseName: naoko
    user: naoko
